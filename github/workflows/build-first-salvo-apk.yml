name: Build FIRST SALVO 2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-first-salvo-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FIRST_SALVO_2_ANDROID_v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIRST_SALVO_2_ANDROID_APK
          path: FIRST_SALVO_2_ANDROID_v1.apk
          retention-days: 90
